<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Luxe Escapes - Discover the world by AI</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f4f7fc;
      margin: 0;
      padding: 0;
    }

    .hero {
      background: linear-gradient(to right, #14213d, #1f4068);
      color: white;
      padding: 30px 20px;
      text-align: center;
      position: relative;
    }

    .hero img.logo {
      width: 40px;
      margin-bottom: 5px;
    }

    .hero h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 0;
    }

    .hero p {
      font-size: 1rem;
      margin-top: 6px;
      color: #e0e0e0;
    }

    .card-form {
      max-width: 650px;
      margin: -20px auto 30px;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.07);
    }

    .form-label {
      font-weight: 600;
    }

    #resultContainer {
      max-width: 850px;
      margin: 20px auto;
      padding: 20px;
    }

    .itinerary-card {
      background: white;
      border-left: 5px solid #1f4068;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.95rem;
      background-color: #1f4068;
      color: white;
      margin-top: 40px;
    }

    @media (max-width: 576px) {
      .hero h1 {
        font-size: 1.4rem;
      }
      .card-form {
        margin-top: -15px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Compact Hero Header -->
  <section class="hero">
    <img src="logo.PNG" alt="Luxe Escapes Logo" class="logo" />
    <h1>Luxe Escapes</h1>
    <p>Discover the world by AI</p>
  </section>

  <!-- Travel Form -->
  <div class="card-form">
    <form id="travelForm">
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="fromCity" class="form-label">From</label>
          <input type="text" class="form-control" id="fromCity" required placeholder="e.g. Kolkata" />
        </div>
        <div class="col-md-6">
          <label for="toCity" class="form-label">Destination</label>
          <input type="text" class="form-control" id="toCity" required placeholder="e.g. Goa" />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label for="startDate" class="form-label">Start Date</label>
          <input type="date" class="form-control" id="startDate" required />
        </div>
        <div class="col-md-6">
          <label for="endDate" class="form-label">End Date</label>
          <input type="date" class="form-control" id="endDate" required />
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="adults" class="form-label">Adults</label>
          <input type="number" class="form-control" id="adults" min="1" required />
        </div>
        <div class="col-md-4">
          <label for="kids" class="form-label">Kids</label>
          <input type="number" class="form-control" id="kids" min="0" />
        </div>
        <div class="col-md-4">
          <label for="rooms" class="form-label">Rooms</label>
          <input type="number" class="form-control" id="rooms" min="1" required />
        </div>
      </div>

      <div class="mb-3">
        <label for="travelClass" class="form-label">Travel Class</label>
        <select class="form-select" id="travelClass">
          <option value="cheap">Cheap</option>
          <option value="premium">Premium</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100">Generate Plan</button>
    </form>
  </div>

  <!-- Itinerary Output -->
  <div id="resultContainer"></div>

  <!-- Footer -->
  <footer>
    Developed by Animesh Manna
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById("travelForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const from = document.getElementById("fromCity").value;
      const to = document.getElementById("toCity").value;
      const result = document.getElementById("resultContainer");
      result.innerHTML = `
        <div class="itinerary-card">
          <h4>Sample Itinerary</h4>
          <p><strong>From:</strong> ${from}</p>
          <p><strong>To:</strong> ${to}</p>
          <p>This is where the AI-generated plan will appear once integrated with the backend.</p>
        </div>
      `;
    });
  </script>
</body>
</html>
